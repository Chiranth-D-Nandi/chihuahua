version: "3.9"

# ─────────────────────────────────────────────
#  FISSION — Docker Compose Stack
#  Cross-Modal Prompt Injection in Tool-Calling VLM Multi-Agent Systems
#  Abhyudaya M Hegde | Chiranth D Nandi
#
#  Build & run from the FISSION project root:
#      docker compose -f docker/docker-compose.yml up --build
#
#  All build contexts are the project root (../ relative to this file)
#  so the five service Dockerfiles can COPY shared packages.
# ─────────────────────────────────────────────

networks:
  fission-net:
    driver: bridge

volumes:
  mlflow-data:
  redis-data:
  ollama-models:
  attack-artifacts:
  report-output:

services:

  # ── Redis — MCP bus (Streams) + context buffer (key-value) ──────────────────
  fission-redis:
    image: redis:7-alpine
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory ${REDIS_MAX_MEMORY:-512mb}
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - fission-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── MLflow — Experiment tracking + artifact storage ─────────────────────────
  fission-mlflow:
    image: ghcr.io/mlflow/mlflow:v${MLFLOW_VERSION:-2.14.3}
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow
    networks:
      - fission-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Ollama — VLM serving (LLaVA / Qwen / InternVL2) via GPU ─────────────────
  fission-ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - fission-net
    environment:
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
    restart: unless-stopped
    # Uncomment when a GPU is available on the host:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Orchestrator — Queries VLM, signs instructions via HMAC ─────────────────
  fission-orchestrator:
    image: fission-orchestrator:latest
    build:
      context: ..
      dockerfile: docker/orchestrator/Dockerfile
    environment:
      - REDIS_HOST=fission-redis
      - REDIS_PORT=6379
      - OLLAMA_HOST=fission-ollama
      - OLLAMA_PORT=11434
      - HMAC_SECRET=${HMAC_SECRET:-change-me-in-production}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-llava:latest}
      - FISSION_LLAVA_MODEL=${DEFAULT_MODEL:-llava:latest}
      - FISSION_OLLAMA_HOST=http://fission-ollama:11434
      - FISSION_REDIS_HOST=fission-redis
      - FISSION_HMAC_SECRET=${HMAC_SECRET:-change-me-in-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - fission-net
    depends_on:
      fission-redis:
        condition: service_healthy
      fission-ollama:
        condition: service_started
    restart: unless-stopped

  # ── Executor — B3 Semantic Guard + B4 TCIV + tool dispatch ──────────────────
  fission-executor:
    image: fission-executor:latest
    build:
      context: ..
      dockerfile: docker/executor/Dockerfile
    environment:
      - REDIS_HOST=fission-redis
      - REDIS_PORT=6379
      - HMAC_SECRET=${HMAC_SECRET:-change-me-in-production}
      - FISSION_REDIS_HOST=fission-redis
      - FISSION_HMAC_SECRET=${HMAC_SECRET:-change-me-in-production}
      - ACTIVE_MODEL=${ACTIVE_MODEL:-llava:latest}
      - ICS_THRESHOLD=${ICS_THRESHOLD:-0.20}
      - ASV_THRESHOLD=${ASV_THRESHOLD:-0.25}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - fission-net
    depends_on:
      fission-redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Phantom — Honeypot executor (B5) traps worm + context payloads ───────────
  fission-phantom:
    image: fission-phantom:latest
    build:
      context: ..
      dockerfile: docker/phantom/Dockerfile
    environment:
      - REDIS_HOST=fission-redis
      - REDIS_PORT=6379
      - FISSION_REDIS_HOST=fission-redis
      - CONTEXT_DRIFT_THRESHOLD=${CONTEXT_DRIFT_THRESHOLD:-0.30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - fission-net
    depends_on:
      fission-redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Attacks — Red-team runner: L0 through L5b ────────────────────────────────
  fission-attacks:
    image: fission-attacks:latest
    build:
      context: ..
      dockerfile: docker/attacks/Dockerfile
    environment:
      - REDIS_HOST=fission-redis
      - REDIS_PORT=6379
      - MLFLOW_TRACKING_URI=http://fission-mlflow:5000
      - OLLAMA_HOST=fission-ollama
      - OLLAMA_PORT=11434
      - FISSION_OLLAMA_HOST=http://fission-ollama:11434
      - FISSION_REDIS_HOST=fission-redis
      - ACTIVE_MODEL=${ACTIVE_MODEL:-llava:latest}
      - MANIFEST_PATH=/app/adversarial_dataset/manifest.json
      - ARTIFACT_DIR=/artifacts
      - KEEP_ALIVE=${ATTACKS_KEEP_ALIVE:-0}
      - ATTACK_CMD=${ATTACK_CMD:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - attack-artifacts:/artifacts
      - report-output:/app/reports
    networks:
      - fission-net
    depends_on:
      fission-redis:
        condition: service_healthy
      fission-mlflow:
        condition: service_healthy
      fission-ollama:
        condition: service_started
    restart: on-failure
    # Uncomment when a GPU is available:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Dashboard — FastAPI control plane + static UI ────────────────────────────
  fission-dashboard:
    image: fission-dashboard:latest
    build:
      context: ..
      dockerfile: docker/dashboard/Dockerfile
    ports:
      - "${DASHBOARD_PORT:-8000}:8000"
    environment:
      - REDIS_HOST=fission-redis
      - REDIS_PORT=6379
      - FISSION_REDIS_HOST=fission-redis
      - FISSION_OLLAMA_HOST=http://fission-ollama:11434
      - MLFLOW_TRACKING_URI=http://fission-mlflow:5000
      - HMAC_SECRET=${HMAC_SECRET:-change-me-in-production}
      - FISSION_HMAC_SECRET=${HMAC_SECRET:-change-me-in-production}
      - DEFAULT_MODELS=${DEFAULT_MODELS:-llava:latest,qwen2.5vl:7b,internvl2:8b}
      - HF_TOKEN=${HF_TOKEN:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - report-output:/app/reports
      - attack-artifacts:/artifacts:ro
    networks:
      - fission-net
    depends_on:
      fission-redis:
        condition: service_healthy
      fission-mlflow:
        condition: service_healthy
    restart: unless-stopped
